[general]
name = "langarena"
version = "0.1.0"

[build]
files = [
    "main.fix",
    "helper.fix",
    "heap.fix",
    "bench.fix",
    "benchmarks/base64.fix",
    "benchmarks/binarytrees.fix",
    "benchmarks/brainfuck.fix",
    "benchmarks/buffer_hash.fix",
    "benchmarks/calculator.fix",
    "benchmarks/compress.fix",
    "benchmarks/compress_arith.fix",
    "benchmarks/compress_bwt.fix",
    "benchmarks/compress_huffman.fix",
    "benchmarks/compress_lzw.fix",
    "benchmarks/distance.fix",
    "benchmarks/fannkuchredux.fix",
    "benchmarks/game_of_life.fix",
    "benchmarks/graph_path.fix",
    "benchmarks/mandelbrot.fix",
    "benchmarks/matmul.fix",
    "benchmarks/maze.fix",
    "benchmarks/nbody.fix",
    "benchmarks/neural_net.fix",
    "benchmarks/sieve.fix",
    "benchmarks/sort.fix",
    "benchmarks/spectralnorm.fix",
    "benchmarks/text_raytracer.fix",
    "benchmarks/words.fix",
