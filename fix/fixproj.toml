[general]
name = "langarena"
version = "0.1.0"

[build]
files = [
    "main.fix",
    "helper.fix",
    "bench.fix",
    "benchmarks/mandelbrot.fix",
    "benchmarks/sieve.fix",
]
objects = ["target/clock.o"]
dynamic_links = ["m"]
preliminary_commands = [["make", "target/clock.o"]]

[[dependencies]]
name = "minilib-json"
version = "0.7.0"
git = { url = "https://github.com/pt9999/fixlang-minilib-json.git" }

[[dependencies]]
name = "minilib-collection"
version = "0.9.0"
git = { url = "https://github.com/pt9999/fixlang-minilib-collection.git" }
