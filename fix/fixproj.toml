git = { url = "https://github.com/tttmmmyyyy/fixlang-time.git" }

[[dependencies]]
name = "minilib-json"
version = "0.7.0"
git = { url = "https://github.com/pt9999/fixlang-minilib-json.git" }

[[dependencies]]
name = "minilib-collection"
version = "0.9.0"
git = { url = "https://github.com/pt9999/fixlang-minilib-collection.git" }


[[dependencies]]
name = "math"
version = "2.0.0"
git = { url = "https://github.com/tttmmmyyyy/fixlang-math.git" }

[[dependencies]]
name = "hashmap"
version = "2.0.1"
git = { url = "https://github.com/tttmmmyyyy/fixlang-hashmap.git" }