[general]
name = "langarena"
version = "0.1.0"

[build]
files = [
    "main.fix",
    "helper.fix",
    "json/value.fix",
    "json/number.fix",
    "json/read.fix",
    "json/write.fix",
    "heap.fix",
    "bench.fix",
    "benchmarks/base64.fix",
    "benchmarks/binarytrees.fix",
    "benchmarks/brainfuck.fix",
    "benchmarks/buffer_hash.fix",
    "benchmarks/cache_simulation.fix",
