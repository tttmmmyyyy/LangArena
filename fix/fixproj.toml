    "benchmarks/game_of_life.fix",
    "benchmarks/graph_path.fix",
    "benchmarks/json.fix",
    "benchmarks/json_decode.fix",
    "benchmarks/json_points.fix",
    "benchmarks/log_parser.fix",
    "benchmarks/mandelbrot.fix",
    "benchmarks/matmul.fix",
    "benchmarks/maze.fix",
    "benchmarks/nbody.fix",
    "benchmarks/neural_net.fix",
